[project]
name = "minicua"
version = "0.1.0"
description = "Long-horizon browser-first computer-use agent"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "anthropic>=0.34",
    "openai>=1.40",
    "python-dotenv>=1.2.3",
    "pyautogui>=0.9.54",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pywinauto>=0.6.9",
]

[project.scripts]
minicua = "minicua.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicua"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
